name: Tests

on:
  push:
  pull_request:
    branches: [master]

# A pull request from a branch in this repo already gets a run from its push,
# so each job's `if` only runs it again for pull requests from forks.
jobs:
  unit:
    name: Build & unit (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows need runners on those systems: GitHub has them,
        # the Forgejo instance only has a Linux runner
        os: ${{ fromJSON(github.server_url == 'https://github.com' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build + jest specs + prettier check
      - run: npm test

  e2e:
    name: Playwright e2e
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron needs Chromium's system libraries (libnss3, libnspr4, ...) and GTK 3, and
      # keytar needs libsecret. GitHub's Ubuntu image has them; minimal runner images
      # such as Forgejo's don't.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libsecret-1-0
      - run: npx playwright install-deps chromium
      - name: Run e2e tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
        env:
          ELECTRON_ENABLE_LOGGING: "1"
          # Print the app's own stdout/stderr, so a window that never opens shows why
          DEBUG: "pw:browser"
      - uses: actions/upload-artifact@v7
        if: always()
        # The report is a debugging aid, not a check: upload-artifact v4+ refuses to run on
        # non-GitHub servers (Forgejo), so don't let that fail a job whose tests passed
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
