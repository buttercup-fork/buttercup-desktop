name: Tests

on:
  push:
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Build & unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build + jest specs + prettier check
      - run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Known limitation: the Electron window does not always come up under a
    # headless (xvfb) display, so this job is informational for now. The suite
    # passes on a real desktop (`npm run test:e2e`).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run e2e tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
        env:
          ELECTRON_ENABLE_LOGGING: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
