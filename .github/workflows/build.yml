name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Allow the release job to create a GitHub release from a tag build.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows need runners on those systems: GitHub has them,
        # the Forgejo instance only has a Linux runner
        include: >-
          ${{ fromJSON(github.server_url == 'https://github.com' && '[{"os": "windows-latest", "package": "package:win"}, {"os": "macos-latest", "package": "package:mac"}, {"os": "ubuntu-latest", "package": "package:linux"}]' || '[{"os": "ubuntu-latest", "package": "package:linux"}]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned in .nvmrc so release builds use a known Node/npm (#1193)
          node-version-file: .nvmrc
          cache: npm

      # Installs deps and builds the buttercup-core git dependency via its
      # `prepare` script.
      - run: npm ci

      - run: npm run build

      # Unsigned CI builds. `--publish never` stops electron-builder trying to
      # talk to the GitHub releases API (the dedicated release job below handles
      # publishing). electron-builder won't hunt for a signing identity
      # (CSC_IDENTITY_AUTO_DISCOVERY), and the custom Windows sign hook skips
      # itself when WIN_YUBIKEY_PIN is unset (resources/scripts/windowsSign.js).
      - name: Package (${{ matrix.package }})
        run: npm run ${{ matrix.package }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # What built these installers, attached to the release (#1193)
      - name: Record build environment
        shell: bash
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "runner: $RUNNER_OS $ImageOS $ImageVersion"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "electron: $(node -p "require('electron/package.json').version")"
            echo "electron-builder: $(node -p "require('electron-builder/package.json').version")"
          } > "dist/build-info-${{ matrix.os }}.txt"
          cat "dist/build-info-${{ matrix.os }}.txt"

      # GitHub has retired upload-artifact v3, and v4+ refuses to run on
      # non-GitHub servers such as Forgejo, so each server gets its own
      - name: Collect installers
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: buttercup-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.7z
            dist/*.blockmap
            dist/latest*.yml
            dist/build-info-*.txt

      - name: Collect installers (Forgejo)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: buttercup-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.7z
            dist/*.blockmap
            dist/latest*.yml
            dist/build-info-*.txt

  release:
    name: Draft GitHub release
    needs: build
    # Releases are published on GitHub only
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # SHA256SUMS.txt for every installer, so downloads can be verified (#1193)
      - name: Write checksums
        run: node resources/scripts/checksums.js artifacts/checksums artifacts/buttercup-*/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
