name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job may write (it creates the draft release)
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows need runners on those systems: GitHub has them,
        # the Forgejo instance only has a Linux runner
        include: >-
          ${{ fromJSON(github.server_url == 'https://github.com' && '[{"os": "windows-latest", "package": "package:win"}, {"os": "macos-latest", "package": "package:mac"}, {"os": "ubuntu-latest", "package": "package:linux"}]' || '[{"os": "ubuntu-latest", "package": "package:linux"}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Pinned in .nvmrc so release builds use a known Node/npm (#1193)
          node-version-file: .nvmrc
          # No dependency cache for tag builds: release installers are built from a clean install
          cache: ${{ startsWith(github.ref, 'refs/tags/v') && '' || 'npm' }}

      # Installs deps and builds the buttercup-core git dependency via its
      # `prepare` script.
      - run: npm ci

      - run: npm run build

      # Unsigned CI builds. `--publish never` stops electron-builder trying to
      # talk to the GitHub releases API (the dedicated release job below handles
      # publishing). electron-builder won't hunt for a signing identity
      # (CSC_IDENTITY_AUTO_DISCOVERY), and the custom Windows sign hook skips
      # itself when WIN_YUBIKEY_PIN is unset (resources/scripts/windowsSign.js).
      - name: Package (${{ matrix.package }})
        run: npm run ${{ matrix.package }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # What built these installers, attached to the release (#1193)
      - name: Record build environment
        shell: bash
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "runner: $RUNNER_OS $ImageOS $ImageVersion"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "electron: $(node -p "require('electron/package.json').version")"
            echo "electron-builder: $(node -p "require('electron-builder/package.json').version")"
          } > "dist/build-info-${{ matrix.os }}.txt"
          cat "dist/build-info-${{ matrix.os }}.txt"

      # Installers are collected on GitHub only: upload-artifact v4+ refuses to
      # run on non-GitHub servers such as Forgejo, and GitHub refuses a workflow
      # that mentions the retired v3 even in a skipped step
      - name: Collect installers
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buttercup-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.7z
            dist/*.blockmap
            dist/latest*.yml
            dist/build-info-*.txt

  release:
    name: Draft GitHub release
    needs: build
    # Releases are published on GitHub only
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # SHA256SUMS.txt for every installer, so downloads can be verified (#1193)
      - name: Write checksums
        run: node resources/scripts/checksums.js artifacts/checksums artifacts/buttercup-*/

      # GitHub's own CLI instead of a third-party release action. --verify-tag refuses
      # a tag that is not on the remote; the release stays a draft until published by hand.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes "${files[@]}"
